name: Ubuntu

on:
  push:
    branches:
      - master  # Trigger on push to master
  pull_request:
    branches:
      - master  # Trigger on pull request to master

jobs:
  build:
    runs-on: ubuntu-latest  # Use Ubuntu environment for the build

    steps:
    - name: Checkout code
      uses: actions/checkout@v7  # Checkout the repository code

    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov  # Install lcov tool

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTEST_COVERAGE=ON  # Configure CMake with Debug and coverage

    - name: Build with coverage flags
      run: cmake --build build --target delegate_app  # Build the project using CMake

    - name: Run delegate_app to execute tests
      run: |
        cd build
        ./delegate_app/delegate_app  # Run your app to execute tests
        
        # Collect code coverage data. --ignore-errors inconsistent: GCC 15 with
        # lcov 2.x reports some lambdas as "line hit but function not hit",
        # which lcov 2.x treats as an error; it doesn't affect the totals.
        lcov --capture --directory . --output-file coverage.info --ignore-errors inconsistent

        # Optionally, filter out system headers and unneeded files
        lcov --remove coverage.info '/usr/*' '*/DmqSerializer.h' '*/msg_serialize.h' --output-file coverage_filtered.info --ignore-errors inconsistent

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5  # Upload coverage report to Codecov
      with:
        token: ${{ secrets.CODECOV_TOKEN }}  # GitHub repository secret for authentication with Codecov
        files: build/coverage_filtered.info  # Path to the filtered coverage file

    - name: Run delegate_app
      run: ./build/delegate_app/delegate_app  # Run the built executable (to run the tests)

    # Builds DelegateMQ the way a non-CMake project does: src/DelegateMQ.cpp plus
    # config/DelegateMQConfig.h, without DelegateMQ.cmake.
    - name: Build no-cmake-integration sample
      run: |
        cmake -S example/sample-projects/no-cmake-integration -B build-no-cmake
        cmake --build build-no-cmake

    - name: Run no-cmake-integration sample
      timeout-minutes: 2
      run: ./build-no-cmake/delegate_app  # exits non-zero unless ALL TESTS PASSED
