; boards/esp32s3-devkitc: DelegateMQ on an ESP32-S3-DevKitC-1 (N8R8: 8 MB
; flash, 8 MB octal PSRAM), FreeRTOS SMP under ESP-IDF.
;
; An ESP-IDF project (CMakeLists.txt + main/) that PlatformIO builds as is;
; idf.py builds it too (see README.md).
;
;   pio run                      build
;   pio run -t upload            flash, through the board's UART port
;   pio device monitor           serial console (115200)
;   pio run -t menuconfig        ESP-IDF configuration

[platformio]
src_dir = main

[env:esp32s3]
; espressif32 6.11.0 bundles ESP-IDF 5.4.1, the version docker/Dockerfile uses
; for os/freertos-esp32. Change both together.
platform = espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1

; N8R8: 8 MB quad-I/O flash. The octal PSRAM is set in sdkconfig.defaults.
board_build.flash_mode = qio
board_upload.flash_size = 8MB

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The board's "USB" port is the ESP32-S3's built-in USB-JTAG: no probe needed
debug_tool = esp-builtin
