# mps2/an385 (Cortex-M3 under QEMU): merged into prj.conf by Zephyr for this
# board only. Built with the Arm GNU toolchain (ZEPHYR_TOOLCHAIN_VARIANT=
# gnuarmemb), whose libstdc++ is built against newlib.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=262144

# printf from several threads, C++ and the CMSIS-RTOS2 layer need more stack
# on real Cortex-M than native_sim (whose threads run on host stacks)
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=4096
CONFIG_CMSIS_V2_THREAD_MAX_STACK_SIZE=8192
CONFIG_CMSIS_V2_THREAD_DYNAMIC_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=1048576

# Catch a stack overflow as a fault (cortex_m_qemu.cpp ends the run) rather
# than as silent memory corruption
CONFIG_HW_STACK_PROTECTION=y
