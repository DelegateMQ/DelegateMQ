# C++ support: Zephyr defaults to a "minimal" C++ library (new/delete and
# virtual dispatch only, no STL headers at all) unless REQUIRES_FULL_LIBCPP
# is selected -- DelegateMQ needs <functional>/<chrono>/<optional>/etc.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# DelegateMQ requires RTTI (dynamic_cast/typeid), which Zephyr disables by
# default.
CONFIG_CPP_RTTI=y

# k_aligned_alloc()/malloc() (used by CmsisRtos2Thread's queue/stack
# allocation, and by the CMSIS-RTOS2 compat layer itself) has no backing
# memory without a real heap; CONFIG_HEAP_MEM_POOL_SIZE defaults to 0.
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_MAIN_STACK_SIZE=8192

# --- CONFIG_CMSIS_RTOS_V2 and its dependencies ---
# Zephyr's own CMSIS-RTOS v2 compatibility layer (subsys/portability/cmsis_rtos_v2/),
# a real implementation of cmsis_os2.h on top of the native Zephyr kernel --
# not a stub. Zephyr's own philosophers/timer_synchronization samples build
# and run this on native_sim in CI, which is why this sample can verify
# dmq::os::CmsisRtos2Thread/Mutex/Semaphore/DelegateQueue here without any
# ARM cross-toolchain, QEMU, or real hardware.
CONFIG_CMSIS_RTOS_V2=y
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_POLL=y
CONFIG_SCHED_SCALABLE=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_CMSIS_V2_THREAD_MAX_STACK_SIZE=2048
CONFIG_CMSIS_V2_THREAD_DYNAMIC_STACK_SIZE=2048

# CmsisRtos2Thread::CreateThread() never sets osThreadAttr_t::stack_mem, i.e.
# it always asks CMSIS-RTOS2 to allocate the thread's stack dynamically --
# this is the standard, spec-compliant way to use osThreadNew(), but Zephyr's
# CMSIS-RTOS2 compat layer refuses ALL such threads unless
# CMSIS_V2_THREAD_DYNAMIC_MAX_COUNT is raised above its default of 0 (see
# subsys/portability/cmsis_rtos_v2/thread.c's osThreadNew(): it returns NULL
# outright when attr->stack_mem == NULL and the dynamic-thread count is
# already at this limit -- 0 means "never allowed"). This sample creates 10
# distinct dmq::os::Thread instances across the whole test suite (2 in
# main_delegate.cpp/TimerDelegateTests.cpp, 2 long-lived worker threads plus
# 6 short-lived FullPolicy-test threads in DelegateThreadsTests.cpp); none of
# their underlying Zephyr threads are ever reclaimed for reuse (thread_num/
# num_dynamic_cb/num_dynamic_stack only ever increment), so the limit must
# cover the cumulative total, not the peak concurrently alive.
CONFIG_CMSIS_V2_THREAD_MAX_COUNT=20
CONFIG_CMSIS_V2_THREAD_DYNAMIC_MAX_COUNT=20

# Same "small static pool, never reclaimed" pattern as the thread limits
# above applies to every other CMSIS-RTOS2 object type Zephyr's compat layer
# hands out (mutex.c/semaphore.c/msgq.c each keep their own monotonic
# count, defaulting to just 5) -- osMutexDelete()/osSemaphoreDelete() do not
# give the slot back. DelegateMQ's dmq::Mutex/RecursiveMutex (CmsisRtos2Mutex.h),
# Signal<Sig>'s internal RecursiveMutex, MulticastDelegateSafe's RecursiveMutex,
# and each dmq::os::Thread's exit semaphore + message queue all draw from
# these pools, and this sample's test suite creates well over 5 of each
# across its lifetime (5 MulticastDelegateSafe containers alone). Raised
# generously since the cost is just static array size, not real overhead.
CONFIG_CMSIS_V2_MUTEX_MAX_COUNT=32
CONFIG_CMSIS_V2_SEMAPHORE_MAX_COUNT=32
CONFIG_CMSIS_V2_MSGQ_MAX_COUNT=32
