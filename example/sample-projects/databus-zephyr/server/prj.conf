# C++ support: Zephyr defaults to a "minimal" C++ library (new/delete and
# virtual dispatch only, no STL headers at all) unless REQUIRES_FULL_LIBCPP
# is selected -- DelegateMQ needs <functional>/<chrono>/<optional>/<memory>/etc.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# DelegateMQ requires RTTI (dynamic_cast/typeid), which Zephyr disables by
# default.
CONFIG_CPP_RTTI=y

# ZephyrDelegateQueue's high/normal priority lanes are drained via k_poll(),
# which is opt-in.
CONFIG_POLL=y

# k_aligned_alloc() (used by ZephyrThread's queue and stack allocation) has
# no backing memory without a real heap; CONFIG_HEAP_MEM_POOL_SIZE defaults
# to 0.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# k_thread_name_set()/get() (ZephyrThread.cpp names the underlying k_thread
# after the dmq::os::Thread's own name) is opt-in.
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=8192

# --- Networking (ZephyrUdpTransport, real host loopback) ---
#
# Unlike zephyr-udp-serializer (both endpoints in one native_sim process,
# using Zephyr's own simulated CONFIG_NET_LOOPBACK interface -- invisible
# to any other host process), this server must be reachable from a genuinely
# separate host process (databus-freertos's client, running as an ordinary
# Linux/Windows binary). native_sim's default networking options don't
# reach the real host network at all without extra setup:
#   - CONFIG_NET_LOOPBACK is Zephyr's own simulated loopback, entirely
#     internal to this one process.
#   - The TAP-based Ethernet driver (CONFIG_ETH_NATIVE_POSIX) reaches the
#     real host network, but needs a "zeth" interface pre-created by
#     net-tools' net-setup.sh, normally requiring root.
# native_sim's "offloaded sockets" driver instead forwards every zsock_*
# call straight to the host's own BSD socket API -- so ZephyrUdpTransport's
# 127.0.0.1 traffic genuinely goes out through the host kernel's real
# loopback interface, reachable by any other host process, with no
# extra host-side setup and no root required.
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
