# C++ support: Zephyr defaults to a "minimal" C++ library (new/delete and
# virtual dispatch only, no STL headers at all) unless REQUIRES_FULL_LIBCPP
# is selected -- DelegateMQ needs <functional>/<chrono>/<optional>/<vector>/etc.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# DelegateMQ requires RTTI (dynamic_cast/typeid), which Zephyr disables by
# default.
CONFIG_CPP_RTTI=y

# ZephyrDelegateQueue's high/normal priority lanes are drained via k_poll(),
# which is opt-in.
CONFIG_POLL=y

# k_aligned_alloc() (used by ZephyrThread's queue and stack allocation) has
# no backing memory without a real heap; CONFIG_HEAP_MEM_POOL_SIZE defaults
# to 0.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# k_thread_name_set()/get() (ZephyrThread.cpp names the underlying k_thread
# after the dmq::os::Thread's own name) is opt-in.
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=8192

# --- Networking (ZephyrUdpTransport) ---
#
# CONFIG_NET_LOOPBACK enables Zephyr's loopback network interface, which
# auto-registers 127.0.0.1 with no devicetree/IP config needed. On
# native_sim specifically, the board's own Kconfig.defconfig then disables
# CONFIG_NET_L2_ETHERNET automatically ("default y if !NET_LOOPBACK"),
# skipping native_sim's TAP/zeth Ethernet emulation entirely -- so this
# sample needs no host-side network setup (no net-setup.sh, no zeth
# interface): everything happens in-process over the loopback interface.
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# ZephyrUdpTransport.h sets SO_RCVTIMEO on every socket (a receive timeout,
# so a blocking recv doesn't hang the calling thread forever). Without this,
# setsockopt(SO_RCVTIMEO) fails with ENOPROTOOPT and Create() never succeeds.
CONFIG_NET_CONTEXT_RCVTIMEO=y
