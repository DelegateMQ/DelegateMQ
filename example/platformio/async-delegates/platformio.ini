; DelegateMQ PlatformIO example, also the board build matrix.
;
;   pio run                          build every board below
;   pio run -e esp32dev              build one board
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e native -t exec        build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/DelegateMQ@^3.0.0
; (here it points at this repository so every commit is tested).

[env]
lib_deps = symlink://../../..
monitor_speed = 115200
; DelegateMQ needs C++17; most embedded cores default to an older standard.
; RTTI is optional: on cores that compile with -fno-rtti (most), DelegateMQ
; builds without it (DMQ_NO_RTTI).
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags = -std=gnu++17

; ESP32 (Xtensa, dual-core FreeRTOS): async delegates on worker threads
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DDMQ_THREAD_FREERTOS

; ESP32-C3 (RISC-V, FreeRTOS): async delegates on worker threads
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = ${env.build_flags} -DDMQ_THREAD_FREERTOS

; ESP32-S3 DevKitC-1 (dual-core Xtensa LX7, FreeRTOS): async delegates on worker threads
; Serial goes to the port labelled UART (USB-UART bridge), which also flashes.
; The port labelled USB is the S3's own USB-Serial/JTAG (OpenOCD debugging);
; add -DARDUINO_USB_CDC_ON_BOOT=1 to send Serial there instead.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = ${env.build_flags} -DDMQ_THREAD_FREERTOS

; STM32 Nucleo-F401RE (Cortex-M4, bare metal): synchronous delegates and signals
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; STM32F4 Discovery (STM32F407VG Cortex-M4, FreeRTOS): async delegates on worker threads
; FreeRTOS comes from the STM32duino FreeRTOS library; setup() starts the
; scheduler (see main.cpp).
; Flashed over its ST-LINK/V2, which has no USB serial port: Serial goes to
; USART6 (TX PC6, RX PC7), 115200 8N1, through a 3.3 V USB-UART adapter or
; the STM32F4DIS-BB base board's DB9 (the wiring used by example/pumptron).
[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = arduino
upload_protocol = stlink
lib_deps = ${env.lib_deps}
    stm32duino/STM32duino FreeRTOS@^10.3.2
extra_scripts = pre:freertos_path.py
build_flags = ${env.build_flags} -DDMQ_THREAD_FREERTOS
    -DSERIAL_UART_INSTANCE=6 -DPIN_SERIAL_TX=PC6 -DPIN_SERIAL_RX=PC7

; Raspberry Pi Pico (RP2040 Cortex-M0+, bare metal): synchronous delegates and signals
; Uses the community arduino-pico core: PlatformIO's default Pico core (Arduino
; mbed) doesn't compile its own sources as C++17.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Desktop (Linux, macOS, or Windows with MinGW): async delegates on std::thread
[env:native]
platform = native
