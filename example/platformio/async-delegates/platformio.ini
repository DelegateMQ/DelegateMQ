; DelegateMQ PlatformIO example, also the board build matrix.
;
;   pio run                          build every board below
;   pio run -e esp32dev              build one board
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e native -t exec        build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/DelegateMQ@^2.4.0
; (here it points at this repository so every commit is tested).

[env]
lib_deps = symlink://../../..
monitor_speed = 115200
; DelegateMQ needs C++17 and RTTI. Most embedded cores default to an older
; standard and -fno-rtti, so swap them for the whole project. -frtti is added
; by cxx_flags.py: build_flags also reaches C files, which warn about it.
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14 -fno-rtti
build_flags = -std=gnu++17
extra_scripts = pre:cxx_flags.py

; ESP32 (Xtensa, dual-core FreeRTOS): async delegates on worker threads
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DDMQ_THREAD_FREERTOS

; ESP32-C3 (RISC-V, FreeRTOS): async delegates on worker threads
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = ${env.build_flags} -DDMQ_THREAD_FREERTOS

; STM32 Nucleo-F401RE (Cortex-M4, bare metal): synchronous delegates and signals
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; Raspberry Pi Pico (RP2040 Cortex-M0+, bare metal): synchronous delegates and signals
; Uses the community arduino-pico core: PlatformIO's default Pico core (Arduino
; mbed) doesn't compile its own sources as C++17.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Desktop (Linux, macOS, or Windows with MinGW): async delegates on std::thread
[env:native]
platform = native
