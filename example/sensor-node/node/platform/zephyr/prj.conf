# sensor-node on Zephyr's native_sim

# C++17 with the full standard library, RTTI (DataBus)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_RTTI=y
CONFIG_POLL=y
CONFIG_THREAD_NAME=y

# The node's three threads take 16 KB stacks from the kernel heap
# (DMQ_ZEPHYR_STACK_BYTES); the main thread runs RunNode()
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=16384

# The latency and statistics lines print floats
CONFIG_PICOLIBC_IO_FLOAT=y

# Networking: native_sim's offloaded sockets, which forward every zsock_* call
# to the host's own sockets, so the host's sensor_pc reaches the node on
# 127.0.0.1 (as databus/zephyr/server does)
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
