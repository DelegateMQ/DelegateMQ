; sensor-node on the ESP32-S3-DevKitC-1 (N8R8): the node/app code on ESP-IDF's
; FreeRTOS, both cores, Wi-Fi to the PC client.
;
; An ESP-IDF project (CMakeLists.txt + main/) that PlatformIO builds as is;
; idf.py builds it too (see README.md).
;
;   pio run -t menuconfig        Wi-Fi SSID and password, the PC's address
;   pio run                      build
;   pio run -t upload            flash
;   pio device monitor           serial console (115200)

[platformio]
src_dir = main

[env:esp32s3]
; espressif32 6.11.0 bundles ESP-IDF 5.4.1, like boards/esp32s3-devkitc and
; os/freertos-esp32. Change them together.
platform = espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1

; N8R8: 8 MB quad-I/O flash. The octal PSRAM is set in sdkconfig.defaults.
board_build.flash_mode = qio
board_upload.flash_size = 8MB
; The 1.5 MB app partition (CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE in
; sdkconfig.defaults); PlatformIO sizes the app from this, not from sdkconfig
board_build.partitions = partitions_singleapp_large.csv

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

debug_tool = esp-builtin
