<svg width="800" height="657" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Styles -->
  <style>
    .app-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; } /* Blue for User Code */
    .lib-box { fill: #fff9c4; stroke: #fbc02d; stroke-width: 2; } /* Yellow for DelegateMQ Core */
    .lib-middleware-box { fill: #fffde7; stroke: #fbc02d; stroke-width: 2; } /* Lighter Yellow for Middleware */
    .lib-infra-box { fill: #fffde7; stroke: #fbc02d; stroke-dasharray: 4; stroke-width: 2; } /* Dashed Yellow for Interfaces */
    .ext-box { fill: #f5f5f5; stroke: #616161; stroke-width: 2; } /* Grey for External Implementations */
    .text { font-family: Arial, sans-serif; font-size: 13px; text-anchor: middle; fill: #212121; }
    .title { font-weight: bold; font-size: 15px; }
    .small { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #424242; }
    .classname { font-family: 'Courier New', monospace; font-size: 11px; text-anchor: middle; fill: #616161; }
    .arrow { stroke: #424242; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#424242" />
    </marker>
  </defs>

  <!-- Application Layer -->
  <rect x="50" y="20" width="700" height="50" rx="5" class="app-box"/>
  <text x="400" y="50" class="text title">User Application Code</text>

  <!-- Middleware Layer (Part of Library) -->
  <rect x="50" y="90" width="220" height="70" rx="5" class="lib-middleware-box"/>
  <text x="160" y="120" class="text title">DataBus (DDS Lite)</text>
  <text x="160" y="140" class="classname">dmq::databus::DataBus</text>

  <rect x="290" y="90" width="220" height="70" rx="5" class="lib-middleware-box"/>
  <text x="400" y="120" class="text title">Signal / Slot</text>
  <text x="400" y="140" class="classname">dmq::Signal&lt;Sig&gt;</text>

  <rect x="530" y="90" width="220" height="70" rx="5" class="lib-middleware-box"/>
  <text x="640" y="120" class="text title">Remote (RPC)</text>
  <text x="640" y="140" class="classname">dmq::rpc::RemoteDispatcher</text>

  <!-- Core Layer (Part of Library) -->
  <rect x="50" y="200" width="220" height="70" rx="5" class="lib-box"/>
  <text x="160" y="230" class="text title">Delegate</text>
  <text x="160" y="250" class="text">(Synchronous)</text>

  <rect x="290" y="200" width="220" height="70" rx="5" class="lib-box"/>
  <text x="400" y="230" class="text title">DelegateAsync</text>
  <text x="400" y="250" class="text title">DelegateAsyncWait</text>


  <rect x="530" y="200" width="220" height="70" rx="5" class="lib-box"/>
  <text x="640" y="240" class="text title">DelegateRemote</text>

  <!-- Infrastructure Layer (Part of Library) -->
  <rect x="290" y="290" width="220" height="50" rx="5" class="lib-infra-box"/>
  <text x="400" y="320" class="text title">IThread</text>

  <rect x="530" y="290" width="105" height="50" rx="5" class="lib-infra-box"/>
  <text x="582" y="320" class="text title">IDispatcher</text>

  <rect x="645" y="290" width="105" height="50" rx="5" class="lib-infra-box"/>
  <text x="697" y="320" class="text title">ISerializer</text>

  <rect x="530" y="350" width="220" height="50" rx="5" class="lib-infra-box"/>
  <text x="640" y="380" class="text title">ITransport</text>

  <!-- DelegateMQ Abstraction Layer (Part of Library) -->
  <rect x="50" y="430" width="700" height="92" rx="5" class="lib-box"/>
  <text x="400" y="453" class="text title">DelegateMQ Abstraction Layer</text>
  <text x="400" y="474" class="classname">dmq::os::Thread, dmq::Mutex, dmq::Semaphore, dmq::Clock, dmq::os::StartGate</text>
  <text x="400" y="490" class="classname">dmq::serialization::msgpack::Serializer, rapidjson::Serializer, cereal::Serializer</text>
  <text x="400" y="506" class="classname">dmq::transport::UdpTransport, SerialTransport, ZeroMqTransport, MqttTransport</text>
  <!-- Platform Layer (External to Library) -->
  <rect x="50" y="552" width="700" height="85" rx="5" class="ext-box"/>
  <text x="400" y="577" class="text title">Platform (External)</text>
  <text x="400" y="602" class="text">OS: Windows, Linux, FreeRTOS, ThreadX, Zephyr, CMSIS-RTOS2, NuttX, Qt, Bare-Metal</text>
  <text x="400" y="622" class="text">Transport/Serializers: ZeroMQ, MQTT, TCP, MessagePack, JSON, Cereal...</text>

  <!-- Middleware to Core Arrows -->
  <path d="M 160,160 L 160,180 L 400,180 L 400,195" class="arrow" />
  <path d="M 160,160 L 160,180 L 590,180 L 590,195" class="arrow" />
  <path d="M 400,160 L 400,180 L 160,180 L 160,195" class="arrow" />
  <line x1="640" y1="160" x2="640" y2="195" class="arrow" />

  <!-- Core to Infrastructure Arrows -->
  <line x1="400" y1="270" x2="400" y2="285" class="arrow" />
  <line x1="640" y1="270" x2="640" y2="285" class="arrow" />
  <line x1="640" y1="340" x2="640" y2="345" class="arrow" />

  <!-- Infrastructure to Abstraction Layer Arrows -->
  <line x1="400" y1="340" x2="400" y2="425" class="arrow" />
  <line x1="640" y1="400" x2="640" y2="425" class="arrow" />
  <!-- Abstraction Layer to Platform Arrows -->
  <line x1="400" y1="522" x2="400" y2="547" class="arrow" />
  <line x1="640" y1="522" x2="640" y2="547" class="arrow" />

</svg>
