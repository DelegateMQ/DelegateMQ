<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Styles -->
  <style>
    .class-box { fill: #fdfefe; stroke: #2e4053; stroke-width: 1.5; }
    .app-box { fill: #ebf5fb; stroke: #2e86c1; stroke-width: 2; }
    .interface-box { fill: #f4ecf7; stroke: #8e44ad; stroke-width: 1.5; }
    .text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #2c3e50; }
    .class-name { font-weight: bold; font-size: 14px; text-anchor: middle; }
    .stereotype { font-style: italic; font-size: 11px; text-anchor: middle; }
    .line { stroke: #34495e; stroke-width: 1.2; fill: none; }
    .arrow { marker-end: url(#arrowhead); }
    .aggregation { marker-start: url(#diamond); }
    .dependency { stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <path d="M 0,6 L 6,0 L 12,6 L 6,12 Z" fill="white" stroke="#34495e" />
    </marker>
  </defs>

  <!-- Legend (Top Left) -->
  <rect x="20" y="30" width="220" height="150" fill="#f9f9f9" stroke="#ccc"/>
  <text x="130" y="50" class="text" font-weight="bold">UML Legend</text>
  
  <rect x="35" y="65" width="20" height="15" class="app-box"/>
  <text x="65" y="77" class="text" font-size="11" text-anchor="start">Application Facing</text>

  <line x1="35" y1="100" x2="55" y2="100" class="line arrow aggregation"/>
  <text x="65" y="105" class="text" font-size="11" text-anchor="start">Aggregation</text>

  <line x1="35" y1="130" x2="55" y2="130" class="line arrow"/>
  <text x="65" y="135" class="text" font-size="11" text-anchor="start">Association</text>

  <line x1="35" y1="160" x2="55" y2="160" class="line dependency"/>
  <text x="65" y="165" class="text" font-size="11" text-anchor="start">Dependency</text>

  <!-- DataBus Class -->
  <rect x="280" y="30" width="340" height="150" class="app-box"/>
  <line x1="280" y1="60" x2="620" y2="60" class="line"/>
  <line x1="280" y1="110" x2="620" y2="110" class="line"/>
  <text x="450" y="50" class="text class-name">dmq::databus::DataBus</text>
  <text x="290" y="80" class="text">- m_signals: map&lt;string, ptr&gt;</text>
  <text x="290" y="100" class="text">- m_serializers: map&lt;string, ptr&gt;</text>
  <text x="290" y="130" class="text">+ Publish&lt;T&gt;(topic, data)</text>
  <text x="290" y="150" class="text">+ Subscribe&lt;T&gt;(topic, ...)</text>
  <text x="290" y="170" class="text">+ RegisterSerializer&lt;T&gt;(...)</text>

  <!-- Participant Class -->
  <rect x="280" y="270" width="300" height="100" class="app-box"/>
  <line x1="280" y1="300" x2="580" y2="300" class="line"/>
  <line x1="280" y1="335" x2="580" y2="335" class="line"/>
  <text x="430" y="290" class="text class-name">dmq::databus::Participant</text>
  <text x="290" y="320" class="text">- m_topicToRemoteId: map&lt;string, RID&gt;</text>
  <text x="290" y="355" class="text">+ ProcessIncoming()</text>

  <!-- DataBus to Participant Relationship -->
  <line x1="450" y1="180" x2="430" y2="270" class="line arrow aggregation"/>
  <text x="455" y="225" class="text" font-size="11">0..*</text>

  <!-- ITransport Interface -->
  <rect x="200" y="450" width="220" height="80" class="interface-box"/>
  <line x1="200" y1="485" x2="420" y2="485" class="line"/>
  <text x="310" y="465" class="text stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="310" y="480" class="text class-name">dmq::transport::ITransport</text>
  <text x="210" y="505" class="text">+ Send(data)</text>
  <text x="210" y="522" class="text">+ Receive(data)</text>

  <!-- ISerializer Interface -->
  <rect x="520" y="450" width="220" height="80" class="interface-box"/>
  <line x1="520" y1="485" x2="740" y2="485" class="line"/>
  <text x="630" y="465" class="text stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="630" y="480" class="text class-name">dmq::ISerializer</text>
  <text x="530" y="505" class="text">+ Write(data)</text>
  <text x="530" y="522" class="text">+ Read(data)</text>

  <!-- Relationships -->
  <line x1="380" y1="370" x2="310" y2="450" class="line arrow"/>
  <text x="330" y="415" class="text" font-size="11">1</text>
  
  <!-- DataBus to ISerializer Relationship -->
  <path d="M 620,100 L 710,100 L 710,450" class="line arrow dependency"/>
  <text x="715" y="250" class="text" font-size="11" text-anchor="start">uses</text>

  <!-- NetworkNode Template -->
  <rect x="20" y="270" width="180" height="110" class="app-box" stroke-dasharray="4,2"/>
  <line x1="20" y1="300" x2="200" y2="300" class="line"/>
  <text x="110" y="290" class="text class-name">NetworkNode&lt;...&gt;</text>
  <text x="30" y="320" class="text" font-size="11">T: Transport</text>
  <text x="30" y="335" class="text" font-size="11">P: MaxPeers</text>
  <text x="30" y="350" class="text" font-size="11">S: MaxTopics</text>
  <line x1="200" y1="320" x2="280" y2="320" class="line dependency"/>
  <text x="240" y="315" class="text" font-size="10" text-anchor="middle">uses</text>

</svg>
