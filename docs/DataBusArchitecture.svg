<svg width="770" height="560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Styles -->
  <style>
    .class-box { fill: #fdfefe; stroke: #2e4053; stroke-width: 1.5; }
    .app-box { fill: #ebf5fb; stroke: #2e86c1; stroke-width: 2; }
    .interface-box { fill: #f4ecf7; stroke: #8e44ad; stroke-width: 1.5; }
    .text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #2c3e50; }
    .class-name { font-weight: bold; font-size: 14px; text-anchor: middle; }
    .stereotype { font-style: italic; font-size: 11px; text-anchor: middle; }
    .line { stroke: #34495e; stroke-width: 1.2; fill: none; }
    .arrow { marker-end: url(#arrowhead); }
    .aggregation { marker-start: url(#diamond); }
    .dependency { stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <path d="M 0,6 L 6,0 L 12,6 L 6,12 Z" fill="white" stroke="#34495e" />
    </marker>
  </defs>

  <!-- Legend (Top Left) -->
  <rect x="20" y="30" width="220" height="150" fill="#f9f9f9" stroke="#ccc"/>
  <text x="130" y="50" class="text" font-weight="bold">UML Legend</text>
  
  <rect x="35" y="65" width="20" height="15" class="app-box"/>
  <text x="85" y="77" class="text" font-size="11" text-anchor="start">Application Facing</text>

  <line x1="35" y1="100" x2="75" y2="100" class="line arrow aggregation"/>
  <text x="85" y="105" class="text" font-size="11" text-anchor="start">Aggregation</text>

  <line x1="35" y1="130" x2="75" y2="130" class="line arrow"/>
  <text x="85" y="135" class="text" font-size="11" text-anchor="start">Association</text>

  <line x1="35" y1="160" x2="75" y2="160" class="line dependency"/>
  <text x="85" y="165" class="text" font-size="11" text-anchor="start">Dependency</text>

  <!-- DataBus Class -->
  <rect x="300" y="30" width="300" height="150" class="app-box"/>
  <line x1="300" y1="60" x2="600" y2="60" class="line"/>
  <line x1="300" y1="110" x2="600" y2="110" class="line"/>
  <text x="450" y="50" class="text class-name">dmq::databus::DataBus</text>
  <text x="310" y="80" class="text">- m_signals: map&lt;string, ptr&gt;</text>
  <text x="310" y="100" class="text">- m_serializers: map&lt;string, ptr&gt;</text>
  <text x="310" y="130" class="text">+ Publish&lt;T&gt;(topic, data)</text>
  <text x="310" y="150" class="text">+ Subscribe&lt;T&gt;(topic, ...)</text>
  <text x="310" y="170" class="text">+ RegisterSerializer&lt;T&gt;(...)</text>

  <!-- Participant Class -->
  <rect x="300" y="270" width="300" height="120" class="app-box"/>
  <line x1="300" y1="300" x2="600" y2="300" class="line"/>
  <line x1="300" y1="352" x2="600" y2="352" class="line"/>
  <text x="450" y="290" class="text class-name">dmq::databus::Participant</text>
  <text x="310" y="320" class="text">- m_topicToRemoteId: map&lt;string, RID&gt;</text>
  <text x="310" y="340" class="text">- m_channels: map&lt;RID, RemoteChannel&gt;</text>
  <text x="310" y="374" class="text">+ ProcessIncoming()</text>

  <!-- DataBus to Participant Relationship -->
  <line x1="450" y1="180" x2="450" y2="270" class="line arrow aggregation"/>
  <text x="455" y="225" class="text" font-size="11">0..MAX_PARTICIPANTS</text>

  <!-- ITransport Interface -->
  <rect x="200" y="450" width="220" height="80" class="interface-box"/>
  <line x1="200" y1="485" x2="420" y2="485" class="line"/>
  <text x="310" y="465" class="text stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="310" y="480" class="text class-name">dmq::transport::ITransport</text>
  <text x="210" y="505" class="text">+ Send(os, header)</text>
  <text x="210" y="522" class="text">+ Receive(is, header)</text>

  <!-- ISerializer Interface -->
  <rect x="500" y="450" width="260" height="80" class="interface-box"/>
  <line x1="500" y1="485" x2="760" y2="485" class="line"/>
  <text x="630" y="465" class="text stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="630" y="480" class="text class-name">dmq::ISerializer&lt;void(T)&gt;</text>
  <text x="510" y="505" class="text">+ Write(os, args...)</text>
  <text x="510" y="522" class="text">+ Read(is, args...)</text>

  <!-- Relationships -->
  <line x1="400" y1="390" x2="310" y2="450" class="line arrow"/>
  <text x="345" y="415" class="text" font-size="11">1</text>

  <!-- Participant to ISerializer Relationship -->
  <line x1="560" y1="390" x2="600" y2="450" class="line dependency"/>
  <text x="588" y="418" class="text" font-size="11" text-anchor="start">uses</text>

  <!-- DataBus to ISerializer Relationship -->
  <path d="M 600,100 L 710,100 L 710,450" class="line arrow dependency"/>
  <text x="715" y="250" class="text" font-size="11" text-anchor="start">uses</text>

  <!-- NetworkNode Template -->
  <rect x="10" y="270" width="240" height="100" class="app-box" stroke-dasharray="4,2"/>
  <line x1="10" y1="300" x2="250" y2="300" class="line"/>
  <text x="130" y="290" class="text class-name">dmq::databus::NetworkNode&lt;...&gt;</text>
  <text x="20" y="320" class="text" font-size="11">Transport: ITransport type</text>
  <text x="20" y="335" class="text" font-size="11">MaxPeers</text>
  <text x="20" y="350" class="text" font-size="11">MaxTopics</text>
  <line x1="250" y1="320" x2="300" y2="320" class="line arrow aggregation"/>
  <text x="282" y="310" class="text" font-size="10" text-anchor="middle">1..*</text>

  <!-- NetworkNode registers its participants with the DataBus -->
  <path d="M 240,270 L 240,195 L 270,195 L 270,145 L 300,145" class="line dependency"/>
  <text x="246" y="240" class="text" font-size="10" text-anchor="start">AddParticipant()</text>

</svg>
